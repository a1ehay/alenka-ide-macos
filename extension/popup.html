<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      padding: 20px;
      padding-top: 50px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      border-radius: 16px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    body.dark-theme {
      background: linear-gradient(135deg, #0f1923 0%, #1a2332 100%);
      color: #e0e0e0;
    }
    
    body.dark-theme input[type="text"] {
      background: rgba(192, 192, 192, 0.1);
      border: 1px solid rgba(192, 192, 192, 0.3);
      color: #e0e0e0;
    }
    
    body.dark-theme input[type="text"]:focus {
      background: rgba(192, 192, 192, 0.15);
      border-color: #c0c0c0;
      box-shadow: 0 0 0 3px rgba(192, 192, 192, 0.1);
    }
    
    body.dark-theme input[type="text"]::placeholder {
      color: rgba(192, 192, 192, 0.5);
    }
    
    body.dark-theme .hint-text {
      color: rgba(192, 192, 192, 0.6);
    }
    
    body.dark-theme .path-display {
      background: rgba(192, 192, 192, 0.08);
      border: 1px solid rgba(192, 192, 192, 0.2);
      color: #c0c0c0;
    }
    
    body.light-theme {
      background: linear-gradient(135deg, #e8e8e8 0%, #f5f5f5 100%);
      color: #2d3748;
    }
    
    body.light-theme input[type="text"] {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.2);
      color: #2d3748;
    }
    
    body.light-theme input[type="text"]:focus {
      background: #ffffff;
      border-color: #718096;
      box-shadow: 0 0 0 3px rgba(113, 128, 150, 0.2);
    }
    
    body.light-theme input[type="text"]::placeholder {
      color: rgba(0, 0, 0, 0.4);
    }
    
    body.light-theme .hint-text {
      color: rgba(0, 0, 0, 0.5);
    }
    
    body.light-theme .path-display {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: #4a5568;
    }
    
    h3 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6));
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      font-size: 13px;
      transition: all 0.3s ease;
      outline: none;
    }
    
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: stretch;
    }
    
    .input-row input {
      flex: 1;
      margin-bottom: 0;
    }
    
    .back-btn {
      width: 44px;
      min-width: 44px;
      padding: 0;
      margin-bottom: 0;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
      color: #e0e0e0;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(113, 128, 150, 0.3);
      font-family: 'Orbitron', sans-serif;
    }
    
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(113, 128, 150, 0.5);
    }
    
    .back-btn:active {
      transform: translateY(0);
    }
    
    .back-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .back-btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    button {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    button:hover::before {
      width: 300px;
      height: 300px;
    }
    
    #sendBtn {
      background: linear-gradient(135deg, #2d5a87 0%, #1e3a5f 100%);
      color: #e0e0e0;
      box-shadow: 0 4px 15px rgba(45, 90, 135, 0.3);
    }
    
    #sendBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(45, 90, 135, 0.5);
    }
    
    #sendBtn:active {
      transform: translateY(0);
    }
    
    #clearBtn {
      background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      color: #e0e0e0;
      box-shadow: 0 4px 15px rgba(74, 85, 104, 0.3);
    }
    
    #clearBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 85, 104, 0.5);
    }
    
    #clearBtn:active {
      transform: translateY(0);
    }
    
    #themeBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }
    
    body.dark-theme #themeBtn {
      background: rgba(192, 192, 192, 0.15);
    }
    
    body.light-theme #themeBtn {
      background: rgba(0, 0, 0, 0.1);
    }
    
    #themeBtn:hover {
      transform: scale(1.1) rotate(15deg);
    }
    
    button span {
      position: relative;
      z-index: 1;
    }
    
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      pointer-events: none;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .toast.success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }
    
    .toast.error {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    
    .toast.info {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
    }
    
    .hint-text {
      font-size: 12px;
      margin-bottom: 8px;
      text-align: center;
      font-style: italic;
    }
    
    .path-display {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      margin-bottom: 12px;
      font-family: 'Courier New', monospace;
      word-break: break-all;
    }
    
    .screen {
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="dark-theme">
  <button id="themeBtn" title="Сменить тему">☀️</button>
  
  <h3>a1enka</h3>
  
  <!-- Экран 1: Ввод пути к проекту -->
  <div id="screen1" class="screen">
    <div class="hint-text">Укажите путь к папке вашего проекта</div>
    <input type="text" id="projectPath" placeholder="C:\Users\Name\MyProject">
    <button id="confirmPathBtn"><span>ПОДТВЕРДИТЬ ПУТЬ</span></button>
  </div>
  
  <!-- Экран 2: Ввод имени файла -->
  <div id="screen2" class="screen hidden">
    <div class="path-display" id="currentPathDisplay"></div>
    <div class="hint-text">Введите путь к файлу внутри проекта</div>
    <div class="input-row">
      <input type="text" id="targetFile" placeholder="src/main.js">
      <button id="backBtn" class="back-btn" title="Изменить путь проекта">←</button>
    </div>
    <button id="sendBtn"><span>ОТПРАВИТЬ БУФЕР В ИИ</span></button>
    <button id="clearBtn"><span>ОЧИСТИТЬ БУФЕР</span></button>
  </div>
  
  <div id="toast" class="toast"></div>
  
  <script src="popup.js"></script>
</body>
</html>
